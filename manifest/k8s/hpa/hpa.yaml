
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-1-qa-qa
  namespace: anuj-temp-erc-ns-1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-1-qa-qa

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
